services:
  ever-jobs-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ever-jobs-api:latest
    container_name: ever-jobs-api
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Override or set defaults here
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://ever_jobs:ever_jobs@postgres:5432/ever_jobs}
      EVER_JOBS_LOCAL_ENV_FILE: /app/.local-secrets/.env.local
      WATCHER_HEALTH_URL: http://ever-jobs-watcher:3002/health

      # API Security
      ENABLE_API_KEY_AUTH: ${ENABLE_API_KEY_AUTH:-false}
      API_KEYS: ${API_KEYS:-}
      API_KEY_HEADER_NAME: ${API_KEY_HEADER_NAME:-x-api-key}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_TIMEFRAME: ${RATE_LIMIT_TIMEFRAME:-3600}

      # Caching
      ENABLE_CACHE: ${ENABLE_CACHE:-true}
      CACHE_EXPIRY: ${CACHE_EXPIRY:-3600}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # Search Defaults
      DEFAULT_SITE_NAMES: ${DEFAULT_SITE_NAMES:-linkedin,indeed,zip_recruiter,glassdoor,google}
      DEFAULT_RESULTS_WANTED: ${DEFAULT_RESULTS_WANTED:-20}
      DEFAULT_DISTANCE: ${DEFAULT_DISTANCE:-50}
      DEFAULT_DESCRIPTION_FORMAT: ${DEFAULT_DESCRIPTION_FORMAT:-markdown}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-USA}

      # Swagger
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}

    depends_on:
      watcher-migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - ever-jobs-local-config:/app/.local-secrets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ever_jobs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ever-jobs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ever_jobs -d ever_jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  watcher-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: watcher-runtime
    image: ever-jobs-watcher:latest
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://ever_jobs:ever_jobs@postgres:5432/ever_jobs}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ever-jobs-watcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: watcher-runtime
    image: ever-jobs-watcher:latest
    ports:
      - "${WATCHER_HEALTH_PORT:-3002}:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WATCHER_ENABLED: ${WATCHER_ENABLED:-true}
      WATCHER_SEED_DEFAULT: ${WATCHER_SEED_DEFAULT:-true}
      WATCHER_HEALTH_HOST: 0.0.0.0
      WATCHER_HEALTH_PORT: 3002
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://ever_jobs:ever_jobs@postgres:5432/ever_jobs}
      EVER_JOBS_LOCAL_ENV_FILE: /app/.local-secrets/.env.local
    depends_on:
      watcher-migrate:
        condition: service_completed_successfully
    volumes:
      - ever-jobs-local-config:/app/.local-secrets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  ever-jobs-web:
    profiles: ["gui"]
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_UI_OPERATOR: ${EVER_JOBS_UI_OPERATOR:-true}
    image: ever-jobs-web:latest
    container_name: ever-jobs-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      WEB_PORT: 3000
      VITE_PROXY_TARGET: http://ever-jobs-api:3001
    depends_on:
      ever-jobs-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

volumes:
  ever-jobs-postgres:
  ever-jobs-local-config:
