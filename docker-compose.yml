version: "3.8"

services:
  ever-jobs-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ever-jobs-api:latest
    container_name: ever-jobs-api
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Override or set defaults here
      NODE_ENV: production
      PORT: 3001

      # API Security
      ENABLE_API_KEY_AUTH: ${ENABLE_API_KEY_AUTH:-false}
      API_KEYS: ${API_KEYS:-}
      API_KEY_HEADER_NAME: ${API_KEY_HEADER_NAME:-x-api-key}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_TIMEFRAME: ${RATE_LIMIT_TIMEFRAME:-3600}

      # Caching
      ENABLE_CACHE: ${ENABLE_CACHE:-true}
      CACHE_EXPIRY: ${CACHE_EXPIRY:-3600}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # Search Defaults
      DEFAULT_SITE_NAMES: ${DEFAULT_SITE_NAMES:-linkedin,indeed,zip_recruiter,glassdoor,google}
      DEFAULT_RESULTS_WANTED: ${DEFAULT_RESULTS_WANTED:-20}
      DEFAULT_DISTANCE: ${DEFAULT_DISTANCE:-50}
      DEFAULT_DESCRIPTION_FORMAT: ${DEFAULT_DESCRIPTION_FORMAT:-markdown}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-USA}

      # Swagger
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}

    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ever_jobs
      POSTGRES_USER: ever_jobs
      POSTGRES_PASSWORD: ever_jobs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ever-jobs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ever_jobs -d ever_jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ever-jobs-watcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WATCHER_ENABLED: ${WATCHER_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ever_jobs:ever_jobs@postgres:5432/ever_jobs}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npx", "ts-node", "-r", "tsconfig-paths/register", "apps/watcher/src/main.ts"]
    restart: unless-stopped

volumes:
  ever-jobs-postgres:
